# Configuration dédiée aux tests : indépendante du profil actif sur la machine hôte
# (évite par exemple qu'une variable d'environnement SPRING_PROFILES_ACTIVE parasite
# le comportement des tests).
spring.datasource.url=jdbc:h2:mem:nye-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Le schéma est créé par Flyway (comme en prod) et seulement validé par Hibernate,
# pour que les tests détectent aussi un décalage entre les entités et les migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

nye.jwt.secret=test-secret-for-unit-tests-only-not-for-prod-use
nye.jwt.expiration-ms=3600000

nye.fcm.credentials-path=

nye.upload.dir=${java.io.tmpdir}/nye-test-uploads
nye.upload.base-url=http://localhost:8080/uploads

nye.cors.allowed-origins=http://localhost:5000
