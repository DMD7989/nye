# Dev profile: in-memory H2 database. Le schéma est géré par Flyway (db/migration),
# identique à ce qui tourne en prod sur PostgreSQL — Hibernate ne fait que valider.
spring.datasource.url=jdbc:h2:mem:nyedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
