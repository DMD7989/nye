spring.application.name=nye-backend

spring.profiles.active=dev

# JWT
nye.jwt.secret=${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
nye.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# FCM (notifications push) : chemin vers la clé de compte de service Firebase.
# Laisser vide en dev -> les notifications sont simulées et journalisées au lieu d'être envoyées.
nye.fcm.credentials-path=${FCM_CREDENTIALS_PATH:}

# Upload de photos : stockage local sur disque en dev (§13.5 : remplacer par un stockage objet en prod).
nye.upload.dir=${UPLOAD_DIR:./uploads}
nye.upload.base-url=${UPLOAD_BASE_URL:http://localhost:8080/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# OpenAPI / Swagger UI at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# CORS : origines autorisées pour les clients navigateur (admin web Angular, app Flutter en mode web).
# N'affecte pas l'app mobile (Android/iOS), qui n'est pas soumise à la same-origin policy.
nye.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5000,http://localhost:8081}
