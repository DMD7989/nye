<div class="page-header">
  <div>
    <h1>Carte de chaleur des alertes</h1>
    <p class="page-subtitle">Répartition géographique des signalements actifs et passés</p>
  </div>
</div>

<div class="toolbar">
  <mat-form-field appearance="outline" class="status-filter">
    <mat-label>Filtrer par statut</mat-label>
    <mat-select [(ngModel)]="selectedStatus" (selectionChange)="loadPoints()">
      @for (option of statusOptions; track option.value) {
        <mat-option [value]="option.value">{{ option.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>

<div class="map-card">
  <div #mapContainer class="map-container"></div>
</div>

<div class="legend">
  <span class="legend-item"><span class="dot" style="background:#b45309"></span> En attente</span>
  <span class="legend-item"><span class="dot" style="background:#b3261e"></span> Active</span>
  <span class="legend-item"><span class="dot" style="background:#1b5e3a"></span> Résolue</span>
  <span class="legend-item"><span class="dot" style="background:#757575"></span> Rejetée</span>
</div>
